  <body>
    <!--
      SVG Glass Distortion Filters — included once at body start.
      Used via filter:url(#glass-distortion) on ::after pseudo-elements of cards.
      Safe: applied to individual elements (not fixed full-viewport layers).
      The isolation:isolate + z-index:-1 card technique does NOT cause
      the compositor darkening bug (only full-viewport fixed elements do).
    -->
    <svg id="nexus-glass-svg" width="0" height="0"
         style="position:absolute;pointer-events:none;overflow:hidden;"
         aria-hidden="true">
      <defs>
        <!-- Strong: hero cards, featured callouts (scale 66) -->
        <filter id="glass-distortion-strong" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.017 0.017"
                        numOctaves="2" seed="92" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
          <feDisplacementMap in="SourceGraphic" in2="blurred"
                             scale="66" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Subtle: content cards, stat cards (scale 32) — DEFAULT -->
        <filter id="glass-distortion" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.014 0.014"
                        numOctaves="2" seed="92" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
          <feDisplacementMap in="SourceGraphic" in2="blurred"
                             scale="32" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- Light: UI chrome, buttons (scale 16) -->
        <filter id="glass-distortion-light" x="-2%" y="-2%" width="104%" height="104%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012"
                        numOctaves="1" seed="42" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="1.5" result="blurred" />
          <feDisplacementMap in="SourceGraphic" in2="blurred"
                             scale="16" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
